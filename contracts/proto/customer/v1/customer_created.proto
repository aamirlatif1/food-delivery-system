syntax = "proto3";

package customer.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "de.aamir.foodordering.kafka.model.customer.v1";

// customer-service -> order-service and payment-service on customer-topic, keyed by customer_id.
// Ids only: contact details are fetched from customer-service when needed, never sent on Kafka.
message CustomerCreated {
  string customer_id = 1;
  int64 version = 2;
  google.protobuf.Timestamp created_at = 3;
}
