[versions]
kotlin = "2.4.10"
ksp = "2.3.7"
micronaut-gradle = "5.0.2"
shadow = "9.4.1"
konsist = "0.17.3"
slf4j = "2.0.18"

[libraries]
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
micronaut-library = { id = "io.micronaut.library", version.ref = "micronaut-gradle" }
micronaut-application = { id = "io.micronaut.application", version.ref = "micronaut-gradle" }
micronaut-aot = { id = "io.micronaut.aot", version.ref = "micronaut-gradle" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
