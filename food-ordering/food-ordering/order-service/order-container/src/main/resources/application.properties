micronaut.application.name=order-service
endpoints.health.enabled=true
endpoints.health.sensitive=false
# Order notes AI interpreter: enabled once OPENAI_API_KEY is set, otherwise notes fall back to staff review.
order-service.ai.openai.api-key=${OPENAI_API_KEY:}
order-service.ai.openai.model=gpt-4.1-mini
# Kafka: kafka.enabled switches Micronaut Kafka on; the brokers default to the local docker compose.
kafka.enabled=true
kafka-config.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
# MySQL; the defaults match the local docker compose. Flyway migrates the schema on startup.
datasources.default.url=${ORDER_DB_URL:jdbc:mysql://localhost:3306/order_service?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
datasources.default.username=${ORDER_DB_USERNAME:order_service}
datasources.default.password=${ORDER_DB_PASSWORD:order_service}
datasources.default.driver-class-name=com.mysql.cj.jdbc.Driver
datasources.default.dialect=MYSQL
flyway.datasources.default.enabled=true
